# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages

stages:
    - build
    - lint
    - deploy

before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
#

build-ci-image:
    stage: build
    image: docker:24
    services:
        - docker:24-dind
    script:
        - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
        - docker build -t $CI_REGISTRY_IMAGE/ci-php:8.3 -f docker/ci/Dockerfile .
        - docker push $CI_REGISTRY_IMAGE/ci-php:8.3
    rules:
        - changes:
              - docker/ci/*

php-cs-fixer:
    stage: lint
    image: $CI_REGISTRY_IMAGE/ci-php:8.3
    script:
        - composer install --no-interaction --no-progress --prefer-dist --no-scripts
        - composer lint:fixer:check

phpstan:
    stage: lint
    image: $CI_REGISTRY_IMAGE/ci-php:8.3
    cache:
        key: ${CI_COMMIT_REF_SLUG}
        paths:
            - vendor/
    variables:
        APP_ENV: dev
        APP_DEBUG: "1"
    script:
        - composer install --no-interaction --no-progress --prefer-dist --no-scripts
        - php bin/console cache:warmup --env=dev
        - composer lint:phpstan

deploy-dev-job:
    stage: deploy
    only:
        - dev
    when: manual
    script:
        - echo "$DEPLOY_PRIVATE_SSH_KEY_PROD" | tr -d '\r' | ssh-add -
        - echo "Deploying the DEV project..."
        - ssh -tt -o StrictHostKeyChecking=no -p ${DEPLOY_PORT_PROD:-22} ${DEPLOY_HOST_PROD} \
            "cd ${DEPLOY_PATH_PROD:-/root/sites/${PROJECT_NAME}-dev/} &&
            git reset --hard &&
            git pull origin dev &&
            docker compose down &&
            docker compose --env-file=.env.local up -d --build &&
            docker compose exec php composer install --no-scripts --optimize-autoloader &&
            docker compose exec php bin/console ask:deploy"
#
deploy-prod-job:
    stage: deploy
    only:
        - master
    when: manual
    script:
        - echo "${DEPLOY_PRIVATE_SSH_KEY_PROD}" | tr -d '\r' | ssh-add -
        - echo "Deploying the PROD project..."
        - ssh -tt -o StrictHostKeyChecking=no -p ${DEPLOY_PORT_PROD:-22} ${DEPLOY_HOST_PROD} \
            "cd ${DEPLOY_PATH_PROD:-/root/sites/${PROJECT_NAME}/} &&
            git reset --hard &&
            git pull origin master &&
            docker compose down &&
            docker compose up -d --build &&
            docker compose exec php composer install --no-scripts --optimize-autoloader &&
            docker compose exec php bin/console ask:deploy"
#           docker compose --profile backup up -d --build  need for backup

default:
    cache:
        paths:
            - vendor/
