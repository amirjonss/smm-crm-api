stages:
    - build
    - lint
    - test
    - deploy

before_script:
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
#

build-ci-image:
    stage: build
    image: docker:24
    services: [docker:24-dind]
    variables:
        DOCKER_TLS_CERTDIR: ""
    script:
        - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
        - docker build -t $CI_REGISTRY_IMAGE/ci-php:8.3 -f docker/ci/Dockerfile .
        - docker push $CI_REGISTRY_IMAGE/ci-php:8.3
    rules:
        - changes:
              - docker/ci/*

deps:
    stage: lint
    image: $CI_REGISTRY_IMAGE/ci-php:8.3
    script:
        - composer install --no-interaction --no-progress --prefer-dist --no-scripts
    artifacts:
        paths:
            - vendor/
        expire_in: 1 hour

php-cs-fixer:
    stage: lint
    image: $CI_REGISTRY_IMAGE/ci-php:8.3
    dependencies:
        - deps
    script:
        - composer lint:fixer:check

phpstan:
    stage: lint
    image: $CI_REGISTRY_IMAGE/ci-php:8.3
    dependencies:
        - deps
    services:
        - name: mysql:8.0
          alias: db
    variables:
        APP_ENV: dev
        APP_DEBUG: "1"
        MYSQL_DATABASE: app
        MYSQL_USER: app
        MYSQL_PASSWORD: app
        MYSQL_ROOT_PASSWORD: root
        DATABASE_URL: "mysql://app:app@db:3306/app?serverVersion=8.0"
    script:
        - php bin/console cache:warmup --env=dev --no-optional-warmers
        - composer lint:phpstan

api-test:
    stage: test
    image: $CI_REGISTRY_IMAGE/ci-php:8.3
    dependencies:
        - deps
    services:
        - name: mysql:8.0
          alias: db
        - name: redis:7-alpine
          alias: redis
    variables:
        APP_ENV: test
        APP_DEBUG: "1"
        MYSQL_DATABASE: app_test
        MYSQL_USER: app
        MYSQL_PASSWORD: app
        MYSQL_ROOT_PASSWORD: root
        DATABASE_URL: "mysql://app:app@db:3306/app?serverVersion=8.0"
    before_script:
        - apt-get update && apt-get install -y default-mysql-client
    script:
        - php bin/console doctrine:database:create --if-not-exists --env=test
        - php bin/console doctrine:migrations:migrate --no-interaction --env=test
        - composer test:api

deploy-dev-job:
    stage: deploy
    dependencies:
        - build-ci-image
        - deps
        - php-cs-fixer
        - phpstan
    only:
        - dev
    when: manual
    script:
        - echo "$DEPLOY_PRIVATE_SSH_KEY_PROD" | tr -d '\r' | ssh-add -
        - echo "Deploying the DEV project..."
        - ssh -tt -o StrictHostKeyChecking=no -p ${DEPLOY_PORT_PROD:-22} ${DEPLOY_HOST_PROD} \
            "cd ${DEPLOY_PATH_PROD:-/root/sites/${PROJECT_NAME}-dev/} &&
            git reset --hard &&
            git pull origin dev &&
            docker compose down &&
            docker compose --env-file=.env.local up -d --build &&
            docker compose exec php composer install --no-scripts --optimize-autoloader &&
            docker compose exec php bin/console ask:deploy"
#
deploy-prod-job:
    stage: deploy
    only:
        - master
    when: manual
    script:
        - echo "${DEPLOY_PRIVATE_SSH_KEY_PROD}" | tr -d '\r' | ssh-add -
        - echo "Deploying the PROD project..."
        - ssh -tt -o StrictHostKeyChecking=no -p ${DEPLOY_PORT_PROD:-22} ${DEPLOY_HOST_PROD} \
            "cd ${DEPLOY_PATH_PROD:-/root/sites/${PROJECT_NAME}/} &&
            git reset --hard &&
            git pull origin master &&
            docker compose down &&
            docker compose up -d --build &&
            docker compose exec php composer install --no-scripts --optimize-autoloader &&
            docker compose exec php bin/console ask:deploy"
#           docker compose --profile backup up -d --build  need for backup

default:
    cache:
        key: ${CI_COMMIT_REF_SLUG}
        paths:
            - vendor/
